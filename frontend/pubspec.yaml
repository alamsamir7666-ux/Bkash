name: smart_shop_ledger
description: A hybrid ledger app for bKash agent shops - track cash, bKash balances, commissions, and daily closings.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP / Networking
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.4.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0

  # Routing
  go_router: ^14.2.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.4.0
  form_builder_validators: ^11.0.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  skeletonizer: ^1.4.0
  gap: ^3.0.1
  flutter_animate: ^4.5.0

  # Date / Time
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  # Assets and fonts are loaded dynamically (Google Fonts via HTTP at runtime).
  # Add local asset paths here only if you commit corresponding files.
