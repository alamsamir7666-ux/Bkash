org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# R8 full mode (default since AGP 8.0) treats missing referenced classes as
# hard errors. Flutter's FlutterPlayStoreSplitApplication references Play Core
# classes that we don't ship (we're not using Play Store split APKs).
# Disabling full mode downgrades those to warnings so the release build can
# succeed. The -dontwarn rules in proguard-rules.pro also handle this.
android.enableR8.fullMode=false
