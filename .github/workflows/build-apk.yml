name: Build Flutter APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Download dependencies
        run: flutter pub get

      - name: Verify analysis (non-blocking)
        run: flutter analyze || true

      - name: Build debug APK
        run: |
          flutter build apk \
            --debug \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:3000/api' }}

      - name: Rename APK
        run: |
          mkdir -p build/outputs/apk
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/outputs/apk/smart-shop-ledger-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-shop-ledger-apk
          path: frontend/build/outputs/apk/smart-shop-ledger-debug.apk
          retention-days: 30
          if-no-files-found: error
